name: Ingest NI prices

on:
  # No `schedule:` trigger here anymore — GitHub's own scheduler was
  # measured (this session) dropping roughly half, later closer to 80%,
  # of this workflow's 15-minute-interval cron triggers under load, a
  # documented GitHub Actions limitation not fixable from inside this
  # file (see ingest-provisional.yml's own history of the same problem).
  # Replaced with the same external Cloudflare Worker Cron Trigger
  # (cloudflare/provisional-cron/) already used for the provisional
  # workflow — it now dispatches this workflow too, every 5 minutes, via
  # workflow_dispatch below, reusing the same GITHUB_DISPATCH_TOKEN
  # (GitHub's Actions permission model is per-repository, not per
  # workflow file, so one token already covers both). See the main
  # README's "Provisional ingestion's real trigger" section for the full
  # reasoning and setup. workflow_dispatch stays here regardless, both
  # as what the Worker calls and so this can still be triggered manually
  # if needed.
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run incremental ingestion
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingest_incremental.py
