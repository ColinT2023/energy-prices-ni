name: Ingest NI prices

on:
  # GitHub can delay or silently drop schedule-triggered runs under load
  # (documented: "if the load is sufficiently high enough, some queued
  # jobs may be dropped") — observed here as real cadence landing closer
  # to hourly than the configured interval. Tightened to */15 so that even
  # with drops, the effective gap stays closer to the original 30-minute
  # target. Not a full fix (nothing in the workflow file can force
  # schedule-event reliability), but proportionate: the ingestion script
  # is watermark-based and fully catches up regardless of how long the
  # gap between runs is, so a dropped trigger only ever adds staleness,
  # never lost data.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run incremental ingestion
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingest_incremental.py
