name: Ingest NI provisional prices

on:
  # Matches the main pipeline's interval, not tighter. This repo is
  # public (confirmed directly via the GitHub API), and public repos get
  # unlimited free Actions minutes on standard hosted runners — so
  # billing was never actually the deciding factor here, despite this
  # comment previously assuming otherwise. The real bottleneck, measured
  # directly: GitHub's own scheduler already drops roughly half of this
  # workflow's */15 triggers under load, so tightening further (e.g.
  # */5) would mostly generate more dropped attempts rather than a
  # proportionally faster real cadence, while adding load against the
  # undocumented endpoint below for limited real gain. The coverage-skip
  # check (today_fully_covered, see ingest_provisional.py) stays
  # regardless of interval either way — it's still doing real work
  # protecting that endpoint from unnecessary hits and keeping actual
  # poll work minimal whenever a run isn't skipped.
  #
  # Offset 5 minutes from ingest.yml's "*/15 * * * *" (0/15/30/45),
  # deliberately, not the same slots — measured directly, both workflows
  # were firing within a minute or two of each other on the same
  # schedule, and both showing an ~80% dropped/delayed trigger rate.
  # Doesn't require knowing whether that's account-wide concurrency,
  # repo-level load, or something else specific to landing at the exact
  # same instant — staggering removes that overlap regardless of which
  # it is. Re-measure the actual drop rate after a few hours of real
  # runs before concluding whether this helped.
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch: {}

jobs:
  ingest-provisional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run provisional ingestion
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Kill switch — set to "false" as a repo Variable (not a secret,
          # it isn't sensitive) to stop this job doing anything at all,
          # no code deploy needed. Unset/anything else means enabled.
          PROVISIONAL_INGESTION_ENABLED: ${{ vars.PROVISIONAL_INGESTION_ENABLED }}
        run: python ingest_provisional.py
