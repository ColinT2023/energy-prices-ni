name: Ingest NI provisional prices

on:
  # No `schedule:` trigger here anymore — GitHub's own scheduler was
  # measured directly (this session) dropping ~50-80% of this workflow's
  # */15 triggers under load, a documented GitHub Actions limitation, not
  # something fixable from inside this file. Replaced with an external
  # Cloudflare Worker Cron Trigger (cloudflare/provisional-cron/) that
  # calls workflow_dispatch below every 5 minutes instead — that API
  # isn't subject to the same scheduler queue, so it sidesteps the drop
  # rather than trying to outguess it with a tighter cron interval. See
  # the main README's "Provisional ingestion's real trigger" section and
  # cloudflare/provisional-cron/wrangler.toml for the full reasoning and
  # setup. workflow_dispatch stays here regardless, both as what the
  # Worker calls and so this can still be triggered manually if needed.
  workflow_dispatch: {}

jobs:
  ingest-provisional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run provisional ingestion
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Kill switch — set to "false" as a repo Variable (not a secret,
          # it isn't sensitive) to stop this job doing anything at all,
          # no code deploy needed. Unset/anything else means enabled.
          PROVISIONAL_INGESTION_ENABLED: ${{ vars.PROVISIONAL_INGESTION_ENABLED }}
        run: python ingest_provisional.py
