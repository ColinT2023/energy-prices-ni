name: Ingest NI provisional prices

on:
  # Matches the main pipeline's interval, not tighter — GitHub Actions
  # bills each job run rounded up to a minimum of 1 minute regardless of
  # actual duration, so trigger *count* is what drives cost, not how fast
  # a run finishes. */5 (288 possible runs/day) would cost real money on
  # its own even with every run being an instant no-op; */15 keeps this
  # workflow's ceiling roughly in line with the main pipeline's. The
  # coverage-skip check (today_fully_covered, see ingest_provisional.py)
  # stays regardless of interval — it's still doing real work protecting
  # the undocumented endpoint from unnecessary hits and keeping actual
  # poll work minimal whenever a run isn't skipped, independent of the
  # billing-floor issue this interval change addresses.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ingest-provisional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run provisional ingestion
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Kill switch — set to "false" as a repo Variable (not a secret,
          # it isn't sensitive) to stop this job doing anything at all,
          # no code deploy needed. Unset/anything else means enabled.
          PROVISIONAL_INGESTION_ENABLED: ${{ vars.PROVISIONAL_INGESTION_ENABLED }}
        run: python ingest_provisional.py
